[project]
name = "agents-flow-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
agents-flow-example = "agents_flow_example:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
